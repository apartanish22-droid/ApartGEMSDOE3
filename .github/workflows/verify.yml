name: Verify evidence and site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache and verify byte-pinned shared template
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/cache_shared_template.py
      - name: Verify generated pages and Python safeguards
        run: |
          python scripts/build_site.py --check
          python -m pytest -q
      - name: Browser smoke tests
        run: |
          npm ci --no-audit --no-fund
          npm run test:browser
