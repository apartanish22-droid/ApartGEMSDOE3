name: Test and publish research site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore hash-pinned shared template without republishing it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_template.py
      - name: Unit and integration tests (offline fixtures)
        run: python -m pytest -q
      - name: Verify generated site is current
        run: python scripts/build_site.py --check

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore last available feed (best effort)
        uses: actions/cache/restore@v4
        with:
          path: .feed-cache/live_feed.json
          key: gems-feed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gems-feed-v1-
      - name: Refresh public data without a portal login
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .feed-cache
          if [ -s .feed-cache/live_feed.json ] && python -m json.tool .feed-cache/live_feed.json >/dev/null; then
            cp .feed-cache/live_feed.json docs/data/live_feed.json
          fi
          python scripts/refresh_feed.py
          cp docs/data/live_feed.json .feed-cache/live_feed.json
      - name: Cache last available feed for the next run
        uses: actions/cache/save@v4
        with:
          path: .feed-cache/live_feed.json
          key: gems-feed-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stage public static site
        run: |
          mkdir -p _site
          cp index.html README.md .nojekyll _site/
          cp -r assets docs evidence registry scripts _site/
          mkdir -p _site/vendor
          cp vendor/README.md vendor/template-provenance.json _site/vendor/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
