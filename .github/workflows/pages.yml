name: Review and deploy executive summary
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_site.py --check
      - run: pytest -q
  deploy:
    name: deploy-pages
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static site without raw feature datasets
        run: |
          mkdir -p _site/{assets,evidence,registry,docs}
          cp index.html executive-summary.html research.html _site/
          cp assets/site.css assets/site.js _site/assets/
          cp evidence/*.json _site/evidence/
          cp registry/*.json _site/registry/
          cp -R docs/assets docs/data docs/downloads docs/research _site/docs/
          cp docs/index.html docs/executive-summary.html docs/executive-summary.md docs/review-2026-10-27.md _site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
