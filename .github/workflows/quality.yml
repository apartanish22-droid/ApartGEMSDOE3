name: Site and evidence-record checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate code, evidence records, raster checks, and site links
        run: python -m pytest -q
